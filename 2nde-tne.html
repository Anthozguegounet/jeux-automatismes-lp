<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Automatismes LP"><meta name="theme-color" content="#101b30"><link rel="manifest" href="manifest.webmanifest"><title>2nde TNE — Automatismes</title><style>body{margin:0;background:#101b30;color:#fff;font:clamp(17px,2.1vw,25px) system-ui}main{max-width:1150px;margin:auto;padding:2.5vw}header{display:flex;justify-content:space-between;gap:12px;align-items:center}a{color:#a9d3ff}h1{font-size:clamp(25px,3.5vw,43px)}.panel{background:#1d304e;border-radius:20px;padding:clamp(18px,3vw,36px)}button,select{font:inherit;border:0;border-radius:14px;padding:16px;background:#324b71;color:#fff;cursor:pointer}button:disabled{opacity:.55}.choices{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:25px}.choices button{min-height:85px}.choices button:hover{background:#45648e}.good{background:#176c52!important}.bad{background:#853a45!important}#feedback{min-height:80px;margin-top:20px}#question{font-weight:650;font-size:clamp(22px,3vw,36px);min-height:100px}#visual svg{width:min(100%,570px);max-height:220px}#visual{margin:auto;text-align:center}#next{background:#147c92}#stats{opacity:.8}select{margin:8px} @media(max-width:600px){.choices{grid-template-columns:1fr}.choices button{min-height:60px}}</style><main><header><a href="index.html">← Accueil</a><span id="time"></span></header><h1>2nde TNE — Automatismes</h1><section class="panel" id="setup"><label>Thème <select id="theme"><option value="all">Tous les thèmes</option><option value="fonctions">Fonctions</option><option value="stats">Statistiques</option></select></label><label>Mode <select id="mode"><option value="quiz">Quiz</option><option value="vf">Vrai / Faux</option></select></label><label><input type="checkbox" id="clock"> 25 secondes par question</label><p><button onclick="start()">Commencer les 5 questions</button></p></section><section class="panel" id="game" hidden><p id="stats"></p><div id="question"></div><div id="visual"></div><div id="choices" class="choices"></div><p id="feedback" aria-live="polite"></p><button id="next" onclick="next()" hidden>Question suivante →</button></section></main><script>const bank=[{"t":"fonctions","q":"Si f(3) = 7, quelle est l’image de 3 ?","a":["3","7","10","Impossible à savoir"],"c":1,"e":"L’image de 3 est f(3), donc 7.","vf":false},{"t":"fonctions","q":"Si f(4) = 9, 4 est…","a":["une image de 9","un antécédent de 9","le maximum","une fréquence"],"c":1,"e":"Un antécédent est une valeur de départ.","vf":false},{"t":"fonctions","q":"Dans f(2) = 5, quel nombre est l’antécédent ?","a":["5","7","2","3"],"c":2,"e":"2 est l’antécédent de 5.","vf":false},{"t":"fonctions","q":"Sur un graphique de fonction, où lit-on les images ?","a":["Sur l’axe vertical","Sur l’axe horizontal","Dans le titre","Sur les deux axes"],"c":0,"e":"Les images sont les ordonnées.","vf":false},{"t":"fonctions","q":"Vrai ou faux : un même nombre peut avoir deux images par une fonction.","a":["Vrai","Faux"],"c":1,"e":"Une fonction associe une unique image à chaque antécédent.","vf":true},{"t":"fonctions","q":"Vrai ou faux : une image peut avoir plusieurs antécédents.","a":["Vrai","Faux"],"c":0,"e":"Deux valeurs de x peuvent donner le même f(x).","vf":true},{"t":"fonctions","q":"Si f(0) = -2, quelle est l’image de 0 ?","a":["0","2","-2","-1"],"c":2,"e":"On lit directement f(0) = -2.","vf":false},{"t":"fonctions","q":"Si f(6) = 12, quel nombre est une image ?","a":["6","12","18","2"],"c":1,"e":"12 est l’image de 6.","vf":false},{"t":"fonctions","q":"Dans un tableau de valeurs, la ligne x contient généralement…","a":["les images","les antécédents","les effectifs","les fréquences"],"c":1,"e":"x est la variable d’entrée.","vf":false},{"t":"fonctions","q":"Vrai ou faux : f(5) désigne l’image de 5.","a":["Vrai","Faux"],"c":0,"e":"C’est la notation usuelle.","vf":true},{"t":"fonctions","q":"Le point (2 ; 4) est sur la courbe de f. Que vaut f(2) ?","a":["2","4","6","8"],"c":1,"e":"L’ordonnée du point est l’image.","vf":false},{"t":"fonctions","q":"Si f(1) = 4 et f(3) = 4, combien d’antécédents de 4 sont connus ?","a":["0","1","2","4"],"c":2,"e":"1 et 3 sont deux antécédents distincts.","vf":false},{"t":"stats","q":"Quel graphique est adapté à des catégories (marques, couleurs) ?","a":["Diagramme en bâtons","Courbe de fonction","Nuage de points","Aucun"],"c":0,"e":"Les bâtons représentent les effectifs des catégories.","vf":false},{"t":"stats","q":"Une classe compte 20 élèves, dont 5 choisissent le vélo. Quelle fréquence ?","a":["5 %","20 %","25 %","50 %"],"c":2,"e":"5/20 = 0,25 = 25 %.","vf":false},{"t":"stats","q":"Dans un diagramme en bâtons, la hauteur représente généralement…","a":["le titre","l’effectif ou la fréquence","la date","la couleur"],"c":1,"e":"La hauteur code la valeur de la catégorie.","vf":false},{"t":"stats","q":"Vrai ou faux : une fréquence peut être supérieure à 100 %.","a":["Vrai","Faux"],"c":1,"e":"Une fréquence est comprise entre 0 et 100 %.","vf":true},{"t":"stats","q":"12 élèves sur 30 préfèrent le bus. Quelle fréquence ?","a":["12 %","30 %","40 %","60 %"],"c":2,"e":"12/30 = 0,4.","vf":false},{"t":"stats","q":"Quel est l’effectif total des catégories 4, 6 et 5 ?","a":["11","15","20","30"],"c":1,"e":"4 + 6 + 5 = 15.","vf":false},{"t":"stats","q":"Vrai ou faux : dans un diagramme circulaire, le disque entier vaut 100 %.","a":["Vrai","Faux"],"c":0,"e":"Le disque représente la totalité.","vf":true},{"t":"stats","q":"Une catégorie occupe la moitié d’un disque. Quelle fréquence ?","a":["25 %","50 %","75 %","100 %"],"c":1,"e":"Une moitié correspond à 50 %.","vf":false},{"t":"stats","q":"Dans une enquête sur les transports des élèves, quelle est la population ?","a":["les moyens de transport","les élèves interrogés","les réponses possibles","les pourcentages"],"c":1,"e":"La population est l’ensemble étudié.","vf":false},{"t":"stats","q":"Le moyen de transport utilisé est un caractère…","a":["quantitatif","qualitatif","une moyenne","une fréquence"],"c":1,"e":"Ce sont des catégories, non des nombres mesurés.","vf":false},{"t":"stats","q":"Vrai ou faux : la somme des fréquences de toutes les catégories vaut 100 %.","a":["Vrai","Faux"],"c":0,"e":"Si toutes les catégories sont comptées, la somme vaut 100 %.","vf":true},{"t":"stats","q":"Un diagramme indique 8 élèves à pied, 5 en bus et 7 à vélo. Quel effectif total ?","a":["13","15","20","25"],"c":2,"e":"8 + 5 + 7 = 20.","vf":false}];let pool=[],series=[],pos=0,score=0,locked=false,timer=null,left=25;const $=id=>document.getElementById(id);function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function start(){const theme=$('theme').value,mode=$('mode').value;pool=bank.filter(q=>(theme==='all'||q.t===theme)&&(mode!=='vf'||q.vf));series=shuffle(pool).slice(0,5);pos=0;score=0;$('setup').hidden=true;$('game').hidden=false;show()}function show(){clearInterval(timer);locked=false;let q=series[pos];$('stats').textContent='Question '+(pos+1)+'/5 · Score '+score;$('question').textContent=q.q;$('visual').innerHTML=q.svg||'';$('feedback').textContent='';$('next').hidden=true;let el=$('choices');el.innerHTML='';q.a.forEach((a,i)=>{let b=document.createElement('button');b.textContent=a;b.onclick=()=>answer(i);el.append(b)});if($('clock').checked){left=25;$('time').textContent='⏱ '+left+' s';timer=setInterval(()=>{left--;$('time').textContent='⏱ '+left+' s';if(left<=0)answer(-1)},1000)}else $('time').textContent=''}function answer(i){if(locked)return;locked=true;clearInterval(timer);let q=series[pos];if(i===q.c)score++;[...$('choices').children].forEach((b,j)=>{b.disabled=true;if(j===q.c)b.classList.add('good');else if(j===i)b.classList.add('bad')});$('feedback').textContent=(i===q.c?'✅ Bonne réponse. ':'❌ Réponse attendue : '+q.a[q.c]+'. ')+q.e;$('next').hidden=false;$('stats').textContent='Question '+(pos+1)+'/5 · Score '+score}function next(){pos++;if(pos===series.length){$('question').textContent='Partie terminée : '+score+'/5';$('visual').innerHTML='';$('choices').innerHTML='';$('feedback').textContent=score===5?'Excellent !':'Tu peux recommencer pour progresser.';$('next').hidden=true;let b=document.createElement('button');b.textContent='Nouvelle série';b.onclick=()=>{$('setup').hidden=false;$('game').hidden=true};$('choices').append(b);return}show()}</script></html>
