<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>1MES — Automatismes</title><style>body{margin:0;background:#101b30;color:#fff;font:clamp(17px,2.1vw,25px) system-ui}main{max-width:1150px;margin:auto;padding:2.5vw}header{display:flex;justify-content:space-between;gap:12px;align-items:center}a{color:#a9d3ff}h1{font-size:clamp(25px,3.5vw,43px)}.panel{background:#1d304e;border-radius:20px;padding:clamp(18px,3vw,36px)}button,select{font:inherit;border:0;border-radius:14px;padding:16px;background:#324b71;color:#fff;cursor:pointer}button:disabled{opacity:.55}.choices{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:25px}.choices button{min-height:85px}.choices button:hover{background:#45648e}.good{background:#176c52!important}.bad{background:#853a45!important}#feedback{min-height:80px;margin-top:20px}#question{font-weight:650;font-size:clamp(22px,3vw,36px);min-height:100px}#visual svg{width:min(100%,570px);max-height:220px}#visual{margin:auto;text-align:center}#next{background:#147c92}#stats{opacity:.8}select{margin:8px} @media(max-width:600px){.choices{grid-template-columns:1fr}.choices button{min-height:60px}}</style><main><header><a href="index.html">← Accueil</a><span id="time"></span></header><h1>1MES — Automatismes</h1><section class="panel" id="setup"><label>Thème <select id="theme"><option value="all">Tous les thèmes</option><option value="maths">Statistiques à deux variables</option><option value="sciences">Quantité de matière</option></select></label><label>Mode <select id="mode"><option value="quiz">Quiz</option><option value="vf">Vrai / Faux</option></select></label><label><input type="checkbox" id="clock"> 25 secondes par question</label><p><button onclick="start()">Commencer les 5 questions</button></p></section><section class="panel" id="game" hidden><p id="stats"></p><div id="question"></div><div id="visual"></div><div id="choices" class="choices"></div><p id="feedback" aria-live="polite"></p><button id="next" onclick="next()" hidden>Question suivante →</button></section></main><script>const bank=[{"t":"maths","q":"Un nuage de points monte de gauche à droite. La tendance est…","a":["croissante","décroissante","nulle","circulaire"],"c":0,"e":"Les deux variables augmentent globalement ensemble.","vf":false},{"t":"maths","q":"Dans y = 3x + 2, quel est le coefficient directeur ?","a":["2","3","5","x"],"c":1,"e":"Le coefficient de x est 3.","vf":false},{"t":"maths","q":"Dans y = 2x + 5, quelle valeur prévoit-on pour x = 4 ?","a":["8","9","13","20"],"c":2,"e":"2 × 4 + 5 = 13.","vf":false},{"t":"maths","q":"Vrai ou faux : un ajustement affine passe forcément par tous les points.","a":["Vrai","Faux"],"c":1,"e":"Un ajustement résume une tendance sans passer nécessairement par tous les points.","vf":true},{"t":"maths","q":"Un coefficient R² proche de 1 signifie…","a":["un ajustement affine généralement pertinent","une pente nulle","une causalité prouvée","des données fausses"],"c":0,"e":"R² mesure la part de variabilité expliquée par le modèle.","vf":false},{"t":"maths","q":"Vrai ou faux : R² = 0,95 prouve que X cause Y.","a":["Vrai","Faux"],"c":1,"e":"Une association statistique ne prouve pas la causalité.","vf":true},{"t":"maths","q":"Prévoir à l’extérieur de la plage observée s’appelle…","a":["interpolation","extrapolation","conversion","dilution"],"c":1,"e":"L’extrapolation est plus incertaine.","vf":false},{"t":"maths","q":"Prévoir entre deux valeurs observées s’appelle…","a":["extrapolation","interpolation","moyenne","dissolution"],"c":1,"e":"C’est une interpolation.","vf":false},{"t":"maths","q":"Dans y = -2x + 8, la tendance est…","a":["croissante","décroissante","constante","impossible"],"c":1,"e":"La pente est négative.","vf":false},{"t":"maths","q":"Vrai ou faux : un nuage de points peut montrer une tendance sans alignement parfait.","a":["Vrai","Faux"],"c":0,"e":"Les points peuvent être dispersés autour d’une tendance.","vf":true},{"t":"sciences","q":"Combien de molécules contient une mole ?","a":["6,02 × 10²³","6,02 × 10³","1000","1"],"c":0,"e":"C’est la constante d’Avogadro.","vf":false},{"t":"sciences","q":"Quelle unité utilise-t-on pour une masse molaire ?","a":["g","mol","g/mol","L"],"c":2,"e":"La masse molaire est une masse par mole.","vf":false},{"t":"sciences","q":"Une substance a M = 20 g/mol. Quelle masse pour 2 mol ?","a":["10 g","20 g","40 g","60 g"],"c":2,"e":"m = n × M = 2 × 20.","vf":false},{"t":"sciences","q":"Quelle quantité de matière pour 30 g avec M = 15 g/mol ?","a":["0,5 mol","2 mol","15 mol","450 mol"],"c":1,"e":"n = m/M = 30/15.","vf":false},{"t":"sciences","q":"Vrai ou faux : deux échantillons de 1 mol contiennent autant d’entités.","a":["Vrai","Faux"],"c":0,"e":"Chaque mole contient le même nombre d’entités.","vf":true},{"t":"sciences","q":"Une masse de 250 mg vaut…","a":["0,025 g","0,25 g","2,5 g","25 g"],"c":1,"e":"On divise les milligrammes par 1000.","vf":false},{"t":"sciences","q":"Quelle est la masse molaire de CO₂ ? M(C)=12, M(O)=16 g/mol.","a":["28","32","44","48"],"c":2,"e":"12 + 2 × 16 = 44 g/mol.","vf":false},{"t":"sciences","q":"Quelle est la masse molaire de NH₃ ? M(N)=14, M(H)=1 g/mol.","a":["15","17","18","21"],"c":1,"e":"14 + 3 × 1 = 17 g/mol.","vf":false},{"t":"sciences","q":"Vrai ou faux : n = M/m.","a":["Vrai","Faux"],"c":1,"e":"La relation correcte est n = m/M.","vf":true},{"t":"sciences","q":"0,5 mol représente combien de molécules ?","a":["3,01 × 10²³","6,02 × 10²³","1,204 × 10²⁴","0,5"],"c":0,"e":"On multiplie 0,5 par 6,02 × 10²³.","vf":false},{"t":"sciences","q":"Une substance a M = 50 g/mol. Quelle masse pour 0,2 mol ?","a":["5 g","10 g","25 g","250 g"],"c":1,"e":"0,2 × 50 = 10 g.","vf":false},{"t":"sciences","q":"Si m = 60 g et n = 3 mol, quelle est M ?","a":["20 g/mol","57 g/mol","63 g/mol","180 g/mol"],"c":0,"e":"M = m/n = 60/3.","vf":false},{"t":"sciences","q":"Vrai ou faux : une mole de dioxygène et une mole de dioxyde de carbone ont la même masse.","a":["Vrai","Faux"],"c":1,"e":"Leurs masses molaires sont différentes.","vf":true},{"t":"sciences","q":"Quelle est la masse molaire de O₂ ? M(O)=16 g/mol.","a":["8","16","32","64"],"c":2,"e":"Deux atomes d’oxygène : 2 × 16 = 32 g/mol.","vf":false}];let pool=[],series=[],pos=0,score=0,locked=false,timer=null,left=25;const $=id=>document.getElementById(id);function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function start(){const theme=$('theme').value,mode=$('mode').value;pool=bank.filter(q=>(theme==='all'||q.t===theme)&&(mode!=='vf'||q.vf));series=shuffle(pool).slice(0,5);pos=0;score=0;$('setup').hidden=true;$('game').hidden=false;show()}function show(){clearInterval(timer);locked=false;let q=series[pos];$('stats').textContent='Question '+(pos+1)+'/5 · Score '+score;$('question').textContent=q.q;$('visual').innerHTML=q.svg||'';$('feedback').textContent='';$('next').hidden=true;let el=$('choices');el.innerHTML='';q.a.forEach((a,i)=>{let b=document.createElement('button');b.textContent=a;b.onclick=()=>answer(i);el.append(b)});if($('clock').checked){left=25;$('time').textContent='⏱ '+left+' s';timer=setInterval(()=>{left--;$('time').textContent='⏱ '+left+' s';if(left<=0)answer(-1)},1000)}else $('time').textContent=''}function answer(i){if(locked)return;locked=true;clearInterval(timer);let q=series[pos];if(i===q.c)score++;[...$('choices').children].forEach((b,j)=>{b.disabled=true;if(j===q.c)b.classList.add('good');else if(j===i)b.classList.add('bad')});$('feedback').textContent=(i===q.c?'✅ Bonne réponse. ':'❌ Réponse attendue : '+q.a[q.c]+'. ')+q.e;$('next').hidden=false;$('stats').textContent='Question '+(pos+1)+'/5 · Score '+score}function next(){pos++;if(pos===series.length){$('question').textContent='Partie terminée : '+score+'/5';$('visual').innerHTML='';$('choices').innerHTML='';$('feedback').textContent=score===5?'Excellent !':'Tu peux recommencer pour progresser.';$('next').hidden=true;let b=document.createElement('button');b.textContent='Nouvelle série';b.onclick=()=>{$('setup').hidden=false;$('game').hidden=true};$('choices').append(b);return}show()}</script></html>
